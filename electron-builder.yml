appId: com.rtaffe.atrium
productName: Atrium
copyright: Copyright © 2026 Ryan Taffe

directories:
  output: release
  buildResources: build

# Only what the app needs at runtime. Source, tests and docs are not shipped.
files:
  - dist/**
  - dist-electron/**
  - package.json

# node-pty is a native module: its .node binary and the spawn-helper executable
# have to exist as real files on disk, because nothing can dlopen or exec from
# inside an asar archive.
asarUnpack:
  - node_modules/node-pty/**

afterPack: build/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # Hardened runtime is required for notarisation, and these entitlements are
  # what a terminal needs: node-pty's helper is a separate executable, and the
  # renderer JITs.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Explicitly NOT sandboxed. A sandboxed app cannot spawn arbitrary user
  # tooling, which is the entire point of this one.
  extendInfo:
    NSHighResolutionCapable: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target: [nsis]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Development
  icon: build/icon.png
