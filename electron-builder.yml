appId: com.rtaffe.atrium
productName: Atrium
copyright: Copyright © 2026 Ryan Taffe

directories:
  output: release
  buildResources: build

# Only what the app needs at runtime. Source, tests and docs are not shipped.
files:
  - dist/**
  - dist-electron/**
  - package.json

# node-pty is a native module: its .node binary and the spawn-helper executable
# have to exist as real files on disk, because nothing can dlopen or exec from
# inside an asar archive.
asarUnpack:
  - node_modules/node-pty/**

afterPack: build/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # An .icns rather than a .png: the small sizes are different artwork, not
  # downscales. A chambered spiral has structure that cannot survive being 32
  # pixels wide, so those sizes are redrawn with fewer, broader chambers.
  icon: build/icon.icns
  # Hardened runtime is required for notarisation, and these entitlements are
  # what a terminal needs: node-pty's helper is a separate executable, and the
  # renderer JITs.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Explicitly NOT sandboxed. A sandboxed app cannot spawn arbitrary user
  # tooling, which is the entire point of this one.
  extendInfo:
    NSHighResolutionCapable: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target: [nsis]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Development
  # A directory of exact sizes, not the 1024 master. Given one large PNG,
  # electron-builder installs it at that size and nothing else — and no menu
  # or task switcher looks in hicolor/1024x1024, so the app shows up with a
  # blank icon. `npm run icon` writes these.
  icon: build/icons
  # fpm refuses to build a .deb without a maintainer.
  maintainer: Ryan Taffe <ryan@phave.com>
  # Wayland matches a window to its .desktop entry by app_id. Without a name
  # that matches, the running window is not linked to the launcher and the
  # task switcher falls back to a generic icon even once the theme icons are
  # installed. The name itself comes from `desktopName` in package.json.
  syncDesktopName: true
  synopsis: Run several coding agents in parallel
