<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b0d10"/>
  <!-- The compluvium: four roof planes sloping in toward the opening, lit
       from the upper left. -->
  <polygon points="5,5 27,5 21,11 11,11" fill="#49535f"/>
  <polygon points="5,5 11,11 11,21 5,27" fill="#6a7789"/>
  <polygon points="27,5 27,27 21,21 21,11" fill="#333b47"/>
  <polygon points="5,27 11,21 21,21 27,27" fill="#232932"/>
  <rect x="11" y="11" width="10" height="10" fill="url(#sky)"/>
</svg>
